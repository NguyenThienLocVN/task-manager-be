<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nhắc việc</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #edf2f8; font-family: Arial, sans-serif; color: #0e3060;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #edf2f8;">
      <tr>
        <td align="center" style="padding: 24px 12px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width: 100%; max-width: 600px; background-color: #ffffff;">
            <tr>
              <td>
                <header style="padding: 20px; background-color: #0e3060; text-align: center; color: #ffffff;">
                  <img src="https://qlcv.aiphuongtankhai.vn/_next/image?url=%2Flogo_dong_nai.png&amp;w=256&amp;q=75" alt="Logo Đồng Nai" width="80" style="display: block; width: 80px; height: auto; margin: 0 auto 16px; border: 0;" />
                  <h1 style="margin: 0; font-size: 18px; line-height: 1.5; color: #ffffff;">HỆ THỐNG QUẢN LÝ CÔNG VIỆC <br> PHƯỜNG TÂN KHAI - TP. ĐỒNG NAI</h1>
                </header>
              </td>
            </tr>
            <tr>
              <td style="padding: 32px 24px; font-size: 15px; line-height: 1.6; color: #0e3060;">
                <h2 style="margin: 0 0 16px; font-size: 22px; line-height: 1.4; color: #0e3060;">Nhắc nhở công việc</h2>
                <p style="margin: 0 0 16px;">Bạn có công việc cần xử lý:</p>
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #f2f6fb; border-left: 4px solid #0e3060;">
                  <tr>
                    <td style="padding: 16px; color: #0e3060;">
                      <p style="margin: 0 0 12px;"><strong>Công việc:</strong> {{title}}</p>
                      <p style="margin: 0 0 12px; white-space: pre-wrap;"><strong>Mô tả:</strong> {{description}}</p>
                      <p style="margin: 0;"><strong>Hạn xử lý:</strong> {{dueDate}}</p>
                    </td>
                  </tr>
                </table>
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin: 24px auto 0;">
                  <tr>
                    <td align="center" bgcolor="#0e3060" style="border-radius: 4px;">
                      <a href="{{taskUrl}}" style="display: inline-block; padding: 12px 24px; color: #ffffff; font-weight: bold; text-decoration: none;">Xem công việc</a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td>
                <footer style="padding: 24px; border-top: 1px solid #d5e0ee; background-color: #f2f6fb; text-align: center; font-size: 13px; line-height: 1.6; color: #0e3060;">
                  <p style="margin: 0 0 8px;">Hệ thống thuộc quản lý của <strong>ỦY BAN NHÂN DÂN PHƯỜNG TÂN KHAI</strong></p>
                  <p style="margin: 0;">© 2026 | All rights reserved.</p>
                </footer>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
